<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>傷品</title>

    <style>

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .player {
            width: 90%;
            max-width: 500px;

            padding: 40px 30px;

            background: #1f2937;

            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.4);

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        audio {
            width: 100%;
        }

    </style>

</head>

<body>

    <div class="player">

        <h1>傷品</h1>

        <p>副歌試唱</p>

        <audio controls>

            <source src="music.MP3" type="audio/mpeg">

            您的瀏覽器不支援音樂播放。

        </audio>

    </div>

</body>

</html>
